spring:
  application:
    name: ai-knowledge-backend

  datasource:
      url: jdbc:postgresql://localhost:5433/knowledge_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
  jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update
      open-in-view: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: "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"
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7
          max-tokens: 1000
      embedding:
        enabled: false
    ollama:
      base-url: http://localhost:11434
      embedding:
        enabled: true
        options:
          model: nomic-embed-text
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: knowledge-base
        initialize-schema: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: indexing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: "YWkta25vd2xlZGdlLWFzc2lzdGFudC1zZWNyZXQta2V5LTIwMjQtc2VjdXJl"
  expiration: 86400000

resilience4j:
  circuit-breaker:
    instances:
      groqApi:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 2
  retry:
    instances:
      groqApi:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics